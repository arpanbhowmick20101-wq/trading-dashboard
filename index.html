<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFXBook — Trading Workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#050607;--panel:#0d0f11;--panel2:#151719;--line:#202428;--muted:#75808b;--text:#f4f7fb;--blue:#087cff;--blue2:#0068e8;--red:#ff4050;--green:#08c88a;--gold:#f4b63f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);background:#050607;padding:18px 14px;overflow:auto}.brand{font-size:19px;font-weight:800;letter-spacing:-.7px;margin:2px 5px 38px}.brand i{color:var(--blue);font-style:normal}.beta{font-size:9px;background:#ff8c32;color:#111;padding:4px 6px;border-radius:4px;vertical-align:top;margin-left:5px}.userbox{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:24px}.avatar{background:#cf321e;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px}.userbox small,.muted{color:var(--muted)}.navlabel{font-size:10px;color:#59636e;letter-spacing:1.3px;margin:22px 8px 12px}.nav button{display:flex;align-items:center;gap:13px;width:100%;padding:12px 11px;margin:3px 0;border:0;border-radius:10px;background:transparent;color:#9ba5b0;text-align:left}.nav button:hover,.nav button.active{background:#071d34;color:white}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.nav .ico{width:18px;text-align:center;color:#84909c;font-size:17px}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;position:sticky;top:0;background:#060708ed;backdrop-filter:blur(14px);z-index:5}.pagetitle{min-width:140px;font-size:19px;font-weight:700}.pagetitle small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:4px}.search{flex:1;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 15px;color:#9ba5b0}.topright{margin-left:auto;display:flex;gap:9px;align-items:center}.iconbtn,.primary,.secondary,.danger{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 13px}.primary{background:var(--blue);border-color:var(--blue);font-weight:600}.primary:hover{background:var(--blue2)}.danger{color:var(--red);border-color:#61212a}.content{padding:24px 28px 48px;max-width:1700px;margin:auto}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.metric{display:flex;align-items:center;gap:13px}.metric .symbol{width:42px;height:42px;border-radius:13px;background:#08213a;color:var(--blue);display:grid;place-items:center;font-size:20px}.eyebrow{font-size:10px;letter-spacing:1px;color:#74808d;text-transform:uppercase}.value{font-size:25px;font-weight:800;margin-top:5px;color:var(--blue)}.positive{color:var(--blue)!important}.negative{color:var(--red)!important}.muted{color:var(--muted)}.section{margin-top:22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.sectionhead h2{font-size:16px;margin:0}.chartbox{height:270px;position:relative}.chartbox canvas{width:100%;height:100%}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{color:#74808d;font-size:10px;letter-spacing:.8px;font-weight:500}tr:hover td{background:#111518}.pill{font-size:10px;padding:5px 8px;border-radius:6px;background:#09223b;color:#56a8ff}.pill.red{background:#35191d;color:#ff6974}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:#9ba5b0}.tabs button.active{background:var(--blue);color:white;border-color:var(--blue)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:10px;color:#89939e;text-transform:uppercase;letter-spacing:.7px;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;padding:12px;background:#171a1d;border:1px solid #292e33;color:white;border-radius:10px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--blue)}.full{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #293039;border-radius:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#111416;border:1px solid var(--line);border-radius:10px;min-height:65px;padding:9px;font-size:11px;color:#8d98a3}.day.profit{border-color:#07538c;background:#0a1d2b}.day.loss{border-color:#7b252d;background:#261316}.bar{height:8px;background:#24292e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.modalback{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#0d0f11;border:1px solid #30363c;border-radius:18px;padding:24px}.close{float:right;background:none;border:0;color:#aab2ba;font-size:22px}.notice{padding:12px 14px;background:#0b1c2b;border:1px solid #123d61;color:#80bdff;border-radius:10px;font-size:12px}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:20px}.authbox h1{margin-top:0}.authbox .field{margin:14px 0}.authbox button{width:100%;margin-top:10px}.screenshot{width:100%;max-width:150px;border-radius:8px;border:1px solid var(--line)}.sessionbar{display:flex;height:35px;border-radius:8px;overflow:hidden;margin:18px 0}.sessionbar span{display:grid;place-items:center;font-size:11px;font-weight:700;color:#06111a}.sessionbar span:nth-child(1){background:#ffad42;flex:8}.sessionbar span:nth-child(2){background:#087cff;flex:5}.sessionbar span:nth-child(3){background:#10bfa8;flex:9}.check{display:flex;gap:8px;align-items:center;padding:10px;background:#0b1d18;border:1px solid #126143;border-radius:8px;margin:5px 0}.check input{accent-color:var(--green)}@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.sidebar{height:auto;position:relative;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:4px 8px 12px}.userbox,.navlabel{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{width:auto;white-space:nowrap;padding:10px}.nav button .ico{display:none}.topbar{padding:0 12px;height:62px}.search{display:none}.content{padding:16px 12px}.grid4{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.value{font-size:20px}.card{padding:15px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagetitle{font-size:16px}.topright .iconbtn:first-child{display:none}}
</style></head><body><div id="root"></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><script>
const $=s=>document.querySelector(s);let trades=[],rules={},page='Dashboard',selected=null,range='30 Days',filter='All Trades';const money=n=>(n<0?'-$':'+$')+Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function showError(e){alert(e.message||e)}
async function boot(){try{let me=await api('/me');if(!me.signedIn)return authScreen();await load();render()}catch(e){authScreen()}}async function load(){trades=await api('/trades');rules=await api('/rules')}
function authScreen(){document.body.innerHTML=`<div class="auth"><div class="authbox"><div class="brand"><i>TFB</i> TradeFXBook <span class="beta">BETA</span></div><h1 id="authtitle">Welcome back</h1><p class="muted">Your trading workspace, all in one place.</p><div class="field" id="namefield"><label>Name</label><input id="authname" placeholder="Your name"></div><div class="field"><label>Email</label><input id="authemail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authpass" type="password" placeholder="At least 8 characters"></div><button class="primary" id="authsubmit" onclick="submitAuth()">Create account</button><p class="muted" style="text-align:center;margin-top:18px"><span id="authswitch">Already have an account?</span> <a href="#" onclick="toggleAuth(event)" style="color:#1687ff">Sign in</a></p><div class="notice">Private account data is stored in your local app database.</div></div></div>`;window.authMode='register'}function toggleAuth(e){e.preventDefault();window.authMode=window.authMode==='register'?'login':'register';$('#authtitle').textContent=window.authMode==='register'?'Create your account':'Welcome back';$('#namefield').classList.toggle('hidden',window.authMode==='login');$('#authsubmit').textContent=window.authMode==='register'?'Create account':'Sign in';$('#authswitch').textContent=window.authMode==='register'?'Already have an account?':'New here?'}async function submitAuth(){try{let d=await api('/'+window.authMode,{method:'POST',body:JSON.stringify({name:$('#authname')?.value,email:$('#authemail').value,password:$('#authpass').value})});location.reload()}catch(e){showError(e)}}
const nav=[['Dashboard','▦'],['Trades','▱'],['Journal','▤'],['Performance','▥'],['Trade Analysis','▧'],['Market','↗'],['AI Report','✧'],['Backtesting','⌁'],['Traders Lounge','♧'],['Tools','⚒'],['Sanctuary','◷'],['Settings','⚙']];function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><i>TFB</i> TradeFXBook <span class="beta">BETA</span></div><div class="userbox"><div class="avatar">A</div><div><b>My Trading Desk</b><br><small>Free · Profile</small></div></div><div class="navlabel">MENU</div><nav class="nav">${nav.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</button>`).join('')}</nav><div class="notice" style="margin-top:20px">All workspace features are unlocked in this build.</div></aside><main class="main"><header class="topbar"><div class="pagetitle">${page}<small>${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</small></div><input class="search" placeholder="⌕  Search trades, pages..." oninput="searchAll(this.value)"><div class="topright"><button class="iconbtn" onclick="document.body.classList.toggle('dim')">☾</button><button class="primary" onclick="openTrade()">＋</button><button class="iconbtn" id="clock">◷ --:--</button><button class="iconbtn" onclick="alert('You are all caught up.')">♧</button><button class="iconbtn" onclick="logout()">A⌄</button></div></header><div class="content" id="view">${pageContent()}</div></main></div>`}function render(){document.body.innerHTML=shell();drawChart();if(page==='Market')marketClock();}
function go(p){page=p;selected=null;render()}function logout(){api('/logout',{method:'POST'}).then(()=>location.reload())}function stats(){let total=trades.reduce((a,t)=>a+(+t.pnl||0),0),wins=trades.filter(t=>t.pnl>0).length,loss=trades.filter(t=>t.pnl<0).length,gp=trades.filter(t=>t.pnl>0).reduce((a,t)=>a+t.pnl,0),gl=Math.abs(trades.filter(t=>t.pnl<0).reduce((a,t)=>a+t.pnl,0));return{total,wins,loss,rate:trades.length?wins/trades.length*100:0,gp,gl,pf:gl?gp/gl:0,avg:trades.length?total/trades.length:0}}
function pageContent(){switch(page){case'Dashboard':return dashboard();case'Trades':return tradesPage();case'Journal':return journalPage();case'Performance':return performancePage();case'Trade Analysis':return tradeAnalysis();case'Market':return marketPage();case'AI Report':return aiPage();case'Backtesting':return backtestPage();case'Traders Lounge':return loungePage();case'Tools':return toolsPage();case'Sanctuary':return sanctuaryPage();case'Settings':return settingsPage();default:return dashboard()}}
function dashboard(){let s=stats();return `<div class="grid4">${[['TOTAL P&L',money(s.total),'▣'],['UNREALIZED','+$0.00','∿'],['REALIZED',money(s.total),'▤'],['WIN RATE',s.rate.toFixed(1)+'%','♜']].map((x,i)=>`<div class="card metric"><div class="symbol">${x[2]}</div><div><div class="eyebrow">${x[0]}</div><div class="value ${i===1?'':'positive'}">${x[1]}</div><small class="muted">${i===3?`${s.wins} wins · ${s.loss} losses`:`${trades.length} trades`}</small></div></div>`).join('')}</div><div class="card section"><div class="sectionhead"><div><div class="eyebrow">PERFORMANCE</div><div class="value">${money(s.total)}</div></div><div class="tabs">${['1D','1W','1M','3M','ALL'].map(x=>`<button class="${range===x?'active':''}" onclick="range='${x}';render()">${x}</button>`).join('')}</div></div><div class="chartbox"><canvas id="equity"></canvas></div></div><div class="card section"><div class="sectionhead"><h2>Monthly P&L</h2><b class="positive">${money(s.total)}</b></div>${calendarHTML()}</div><div class="split section"><div class="card"><div class="sectionhead"><h2>Open Positions</h2></div><div class="empty">▤<br>No open positions recorded</div><p class="muted">Connect a supported broker integration when available.</p></div><div class="card"><div class="sectionhead"><h2>Recent Activity</h2><button class="secondary" onclick="go('Trades')">View all →</button></div>${trades.slice(0,4).map(t=>`<div class="row" style="padding:13px 0;border-bottom:1px solid var(--line)"><b>${esc(t.symbol)}</b><span class="pill ${t.side==='Short'?'red':''}">${esc(t.side)}</span><span class="right ${t.pnl>=0?'positive':'negative'}"><b>${money(t.pnl)}</b></span></div>`).join('')||'<div class="empty">No trades yet. Add your first trade.</div>'}</div></div><div class="grid4 section">${[['Avg Win',money(s.wins?s.gp/s.wins:0)],['Avg Loss',money(s.loss?-s.gl/s.loss:0)],['Best Trade',money(Math.max(0,...trades.map(t=>t.pnl)))],['Worst Trade',money(Math.min(0,...trades.map(t=>t.pnl))) ]].map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div>`}
function calendarHTML(){let now=new Date(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();return `<div class="calendar">${['M','T','W','T','F','S','S'].map(d=>`<div class="eyebrow" style="padding:8px">${d}</div>`).join('')}${Array.from({length:days},(_,i)=>{let d=i+1,dayTrades=trades.filter(t=>t.closed&&new Date(t.closed).getDate()===d),p=dayTrades.reduce((a,t)=>a+t.pnl,0);return `<div class="day ${p>0?'profit':p<0?'loss':''}">${d}<br><b class="${p>=0?'positive':'negative'}">${dayTrades.length?money(p):''}</b></div>`}).join('')}</div>`}
function tradesPage(){return `<div class="sectionhead"><div><h2>Trades</h2><small class="muted">${trades.length} recorded trades · Private workspace</small></div><div class="row"><button class="danger" onclick="clearTrades()">♧ Clear All</button><button class="primary" onclick="openTrade()">＋ Add Trade</button></div></div><div class="card"><div class="sectionhead"><h2>Trade History</h2><div class="row"><button class="secondary" onclick="exportCSV()">⇩ Export CSV</button><button class="secondary" onclick="$('#csvfile').click()">Import CSV</button><input id="csvfile" type="file" accept=".csv" hidden onchange="importCSV(this)"></div></div><div class="tablewrap"><table><thead><tr><th>OPEN / CLOSE</th><th>SYMBOL</th><th>TYPE</th><th>ENTRY</th><th>EXIT</th><th>SIZE</th><th>P&L</th><th>SESSION</th><th>ACTIONS</th></tr></thead><tbody>${trades.map(t=>`<tr><td>${esc(t.opened||'—')}<br><span class="muted">${esc(t.closed||'')}</span></td><td><b>${esc(t.symbol)}</b></td><td><span class="pill ${t.side==='Short'?'red':''}">${esc(t.side)}</span></td><td>${t.entry}</td><td>${t.exit}</td><td>${t.quantity}</td><td class="${t.pnl>=0?'positive':'negative'}"><b>${money(t.pnl)}</b></td><td>${esc(t.session)}</td><td><button class="secondary" onclick="openTrade(${t.id})">Edit</button> <button class="danger" onclick="deleteTrade(${t.id})">×</button></td></tr>`).join('')||`<tr><td colspan="9"><div class="empty">No trades yet. Click Add Trade to get started.</div></td></tr>`}</tbody></table></div></div>`}
function journalPage(){let t=selected?trades.find(x=>x.id===selected):trades[0];return `<div class="split"><div class="card"><div class="sectionhead"><div><h2>Trade Journal</h2><small class="muted">${trades.length} journal entries</small></div><button class="primary" onclick="openTrade()">＋</button></div><input class="field" style="width:100%;padding:12px;background:#171a1d;border:1px solid var(--line);border-radius:9px;color:white" placeholder="⌕ Search symbol..." oninput="journalSearch(this.value)"><div id="journalList">${journalList()}</div></div><div class="card">${t?`<div class="sectionhead"><div><h2>${esc(t.symbol)} <span class="pill ${t.pnl>=0?'':'red'}">${t.pnl>=0?'WINNER':'LOSS'}</span></h2><small class="muted">${esc(t.side)} · Entry ${t.entry} · Size ${t.quantity}</small></div><button class="primary" onclick="openTrade(${t.id})">Edit</button></div><div class="formgrid"><div class="field"><label>Pre-trade analysis</label><div class="notice">${esc(t.pre_analysis||'No pre-trade notes yet.')}</div></div><div class="field"><label>Post-trade review</label><div class="notice">${esc(t.post_review||'No post-trade review yet.')}</div></div><div class="field"><label>Emotions</label><div class="notice">${esc(t.emotions||'—')}</div></div><div class="field"><label>Lessons learned</label><div class="notice">${esc(t.lessons||'—')}</div></div><div class="field full"><label>Tags</label><div class="pill">${esc(t.tags||'No tags')}</div></div><div class="field full"><label>Execution checklist</label>${JSON.parse(t.checklist||'[]').map(c=>`<div class="check">✓ ${esc(c)}</div>`).join('')||'<span class="muted">No checklist selected</span>'}</div><div class="field full"><label>Screenshots</label><div class="row">${JSON.parse(t.screenshots||'[]').map(src=>`<img class="screenshot" src="${src}">`).join('')||'<span class="muted">No screenshots attached</span>'}</div></div></div>`:'<div class="empty">Select a journal entry or add a trade.</div>'}</div></div>`}function journalList(){return trades.map(t=>`<button onclick="selected=${t.id};render()" style="width:100%;display:block;text-align:left;background:${selected===t.id?'#0b1d31':'#151719'};border:1px solid ${selected===t.id?'var(--blue)':'var(--line)'};border-radius:12px;padding:15px;margin-top:9px"><b>${esc(t.symbol)}</b><span class="right ${t.pnl>=0?'positive':'negative'}">${money(t.pnl)}</span><br><small class="muted">${esc(t.side)} · ${esc(t.opened||'Date not set')}</small></button>`).join('')||'<div class="empty">Your journal is empty.</div>'}function journalSearch(q){$('#journalList').innerHTML=trades.filter(t=>t.symbol.toLowerCase().includes(q.toLowerCase())).map(t=>`<button class="secondary" style="width:100%;margin-top:8px;text-align:left" onclick="selected=${t.id};render()">${esc(t.symbol)} · ${money(t.pnl)}</button>`).join('')}
function performancePage(){let s=stats(),gross=s.gp,loss=s.gl;return `<div class="sectionhead"><h2>Performance Analytics</h2><div class="tabs">${['Today','7 Days','30 Days','3 Months','1 Year','All Time'].map(x=>`<button class="${range===x?'active':''}" onclick="range='${x}';render()">${x}</button>`).join('')}</div></div><div class="grid4"><div class="card"><div class="eyebrow">TOTAL P&L</div><div class="value">${money(s.total)}</div><small class="muted">From ${trades.length} trades</small></div><div class="card"><div class="eyebrow">WIN RATE</div><div class="value">${s.rate.toFixed(1)}%</div><div class="bar"><span style="width:${s.rate}%"></span></div><small class="muted">${s.wins} wins · ${s.loss} losses</small></div><div class="card"><div class="eyebrow">PROFIT FACTOR</div><div class="value">${s.pf.toFixed(2)}</div><small class="muted">Gross profit / gross loss</small></div><div class="card"><div class="eyebrow">EXPECTANCY</div><div class="value">${money(s.avg)}</div><small class="muted">Average P&L per trade</small></div></div><div class="card section"><div class="sectionhead"><h2>Equity Curve</h2><div class="tabs"><button class="active">Equity</button><button onclick="alert('Drawdown view is calculated from recorded trade history.')">Drawdown</button></div></div><div class="chartbox"><canvas id="equity"></canvas></div></div><div class="split section"><div class="card"><h2>Win / Loss Distribution</h2><div class="bar" style="height:25px;margin:18px 0"><span style="width:${s.rate}%"></span></div><div class="row"><b class="positive">${s.wins} winners</b><b class="negative right">${s.loss} losers</b></div><hr style="border-color:var(--line)"><div class="row"><span>Gross Profit</span><b class="positive right">${money(gross)}</b></div><div class="row" style="margin-top:12px"><span>Gross Loss</span><b class="negative right">-${money(loss)}</b></div></div><div class="card"><h2>Long vs Short</h2>${['Long','Short'].map(side=>{let a=trades.filter(t=>t.side===side),p=a.reduce((x,t)=>x+t.pnl,0);return `<div style="margin-top:18px"><div class="row"><b>${side}</b><b class="right ${p>=0?'positive':'negative'}">${money(p)}</b></div><small class="muted">${a.length} trades · ${a.filter(t=>t.pnl>0).length} winners</small></div>`}).join('')}</div></div><div class="card section"><h2>Your Stats</h2><div class="grid4">${[['Total trades',trades.length],['Winning trades',s.wins],['Losing trades',s.loss],['Average trade',money(s.avg)],['Largest profit',money(Math.max(0,...trades.map(t=>t.pnl)))],['Largest loss',money(Math.min(0,...trades.map(t=>t.pnl)))],['Max drawdown',money(maxDrawdown())],['Average win rate',s.rate.toFixed(1)+'%']].map(x=>`<div style="padding:14px;border-bottom:1px solid var(--line)"><small class="muted">${x[0]}</small><br><b>${x[1]}</b></div>`).join('')}</div></div>`}function maxDrawdown(){let eq=0,peak=0,dd=0;trades.slice().reverse().forEach(t=>{eq+=t.pnl;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq)});return dd}
function tradeAnalysis(){let s=stats();return `<div class="sectionhead"><h2>Trade Analysis</h2><div class="tabs">${['All Trades','Winners','Losers','Break-even'].map((x,i)=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div></div><div class="split"><div class="card"><h2>Trades</h2>${trades.filter(t=>filter==='All Trades'||(filter==='Winners'&&t.pnl>0)||(filter==='Losers'&&t.pnl<0)||(filter==='Break-even'&&t.pnl===0)).map(t=>`<button class="secondary" style="width:100%;margin:5px 0;text-align:left" onclick="selected=${t.id};render()">${esc(t.symbol)} · ${esc(t.side)} <b class="right ${t.pnl>=0?'positive':'negative'}">${money(t.pnl)}</b></button>`).join('')||'<div class="empty">No trades in this filter.</div>'}</div><div class="card"><h2>Trade Quality</h2><div class="value">${trades.length?Math.round(s.rate*.7+Math.min(30,s.pf*8)):0}/100</div><p class="muted">Indicative journal score from recorded outcomes, not a prediction.</p><div class="bar"><span style="width:${Math.min(100,s.rate*.7+Math.min(30,s.pf*8))}%"></span></div><hr style="border-color:var(--line)"><h3>Insights</h3><p class="muted">${s.wins>s.loss?'Your recorded winners currently outnumber your losers.':s.wins<s.loss?'Your recorded losing trades currently outnumber winners.':'Add more trades to build a meaningful pattern.'}</p><p class="muted">${trades.length} trades have been included in this summary.</p><button class="secondary" onclick="selected=trades[0]?.id;go('Journal')">View Full Journal →</button></div></div>`}
function marketPage(){return `<div class="sectionhead"><div><h1>Economic Calendar</h1><p class="muted">Track market events and news that may affect your trading.</p></div><span class="pill">Kolkata · GMT+5:30</span></div><div class="notice">Calendar integration is not connected in this local build. Events below are sample placeholders, not live economic data.</div><div class="tabs section">${['Today','Tomorrow','This Week','All'].map(x=>`<button class="${x==='Today'?'active':''}">${x}</button>`).join('')}</div><div class="card section"><h2>Trading Sessions</h2><div class="sessionbar"><span>Asian</span><span>London</span><span>New York</span></div><div class="split"><div><b>Asian</b><p class="muted">00:00 – 08:00 UTC</p></div><div><b>London</b><p class="muted">08:00 – 13:00 UTC</p></div><div><b>New York</b><p class="muted">13:00 – 22:00 UTC</p></div></div></div><div class="card section"><h2>Events</h2><div class="empty">Live economic calendar data provider is not configured.</div></div>`}function marketClock(){let el=$('#clock');if(el)el.textContent='◷ '+new Date().toLocaleTimeString()}
function aiPage(){let s=stats();return `<div class="sectionhead"><div><h2>AI-Powered Trading Reports</h2><p class="muted">Review patterns from your own journal data.</p></div><button class="primary" onclick="generateReport()">Generate Report</button></div><div class="notice">This first build uses transparent rule-based summaries. A connected AI provider is required for genuine AI-generated analysis.</div><div class="card section" id="aireport"><h2>Trading Overview</h2><p class="muted">${trades.length} trades · Net P&L ${money(s.total)} · Win rate ${s.rate.toFixed(1)}%</p><p>Add trades and select Generate Report to create a summary.</p></div>`}function generateReport(){let s=stats();$('#aireport').innerHTML=`<h2>Journal Performance Summary</h2><p>Across ${trades.length} recorded trades, your net result is <b class="${s.total>=0?'positive':'negative'}">${money(s.total)}</b>.</p><p>Win rate: ${s.rate.toFixed(1)}% (${s.wins} winners, ${s.loss} losers).</p><p>Profit factor: ${s.pf.toFixed(2)}. Average result per trade: ${money(s.avg)}.</p><p class="muted">This is a calculation from your journal, not financial advice or a market forecast.</p>`}
function backtestPage(){return `<div class="sectionhead"><div><h2>Backtesting</h2><p class="muted">Manual strategy review and historical CSV testing.</p></div></div><div class="notice">TradingView chart embeds depend on TradingView availability. CSV backtests run on data you upload; they do not place trades.</div><div class="split section"><div class="card"><h2>TradingView Chart</h2><div style="height:390px"><iframe title="TradingView chart" src="https://www.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=OANDA%3AXAUUSD&interval=60&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=0f1113&theme=dark&style=1&timezone=Asia%2FKolkata" style="width:100%;height:100%;border:0;border-radius:10px" allowfullscreen></iframe></div></div><div class="card"><h2>CSV Strategy Tester</h2><p class="muted">Upload OHLC CSV with columns: time, open, high, low, close.</p><div class="field"><label>Historical candles CSV</label><input id="backcsv" type="file" accept=".csv"></div><div class="field" style="margin-top:12px"><label>Strategy</label><select id="strategy"><option value="ma">Moving average crossover (20 / 50)</option><option value="breakout">20-bar close breakout</option></select></div><div class="field" style="margin-top:12px"><label>Starting balance ($)</label><input id="capital" type="number" value="10000"></div><button class="primary" style="margin-top:15px" onclick="runBacktest()">Run Backtest</button><div id="btresult" class="section"></div></div></div><div class="card section"><h2>Manual Backtest Notes</h2><div class="field"><label>Strategy / setup</label><input id="btname" placeholder="e.g. London session sweep"></div><div class="field" style="margin-top:12px"><label>Observations</label><textarea id="btnote" placeholder="Record rules, screenshots and outcomes..."></textarea></div><button class="secondary" style="margin-top:12px" onclick="saveBTNote()">Save note</button><div id="btnotes" class="muted"></div></div>`}
function runBacktest(){let f=$('#backcsv').files[0];if(!f)return alert('Choose a CSV file first.');let reader=new FileReader();reader.onload=()=>{let lines=reader.result.trim().split(/\r?\n/),head=lines.shift().toLowerCase().split(',').map(x=>x.trim()),idx=head.indexOf('close');if(idx<0)return alert('CSV must include a close column.');let c=lines.map(l=>+l.split(',')[idx]).filter(Number.isFinite),s=$('#strategy').value,bal=+$('#capital').value||10000,pos=0,entry=0,closed=[];for(let i=50;i<c.length;i++){let a=c.slice(Math.max(0,i-20),i).reduce((x,y)=>x+y,0)/Math.min(20,i),b=c.slice(Math.max(0,i-50),i).reduce((x,y)=>x+y,0)/Math.min(50,i);let signal=s==='ma'?(a>b?1:-1):(c[i]>Math.max(...c.slice(i-20,i))?1:c[i]<Math.min(...c.slice(i-20,i))?-1:0);if(pos&&signal!==pos){let p=(c[i]-entry)*pos;bal+=p;closed.push(p);pos=0}if(!pos&&signal){pos=signal;entry=c[i]}}if(pos){let p=(c.at(-1)-entry)*pos;bal+=p;closed.push(p)}let wins=closed.filter(x=>x>0).length;$('#btresult').innerHTML=`<div class="notice">${closed.length} closed signal trades · Ending balance $${bal.toFixed(2)} · Net ${money(bal-(+$('#capital').value||10000))} · Win rate ${closed.length?(wins/closed.length*100).toFixed(1):0}%</div><small class="muted">Illustrative close-to-close test only; excludes spread, commission, slippage and position sizing.</small>`};reader.readAsText(f)}function saveBTNote(){let n=JSON.parse(localStorage.getItem('bt-notes')||'[]');n.unshift({name:$('#btname').value,note:$('#btnote').value});localStorage.setItem('bt-notes',JSON.stringify(n));$('#btnotes').textContent='Saved locally.'}
function loungePage(){return `<div class="sectionhead"><h2>Traders Lounge</h2><span class="pill">Private workspace preview</span></div><div class="card"><h2>Community & Leaderboard</h2><p class="muted">Community publishing, trader profiles and public leaderboard require a hosted multi-user service and moderation controls.</p><div class="empty">No public trader posts yet.</div></div>`}function toolsPage(){return `<div class="sectionhead"><div><h1>Trading Tools</h1><p class="muted">Calculators and utilities for your trading workflow.</p></div></div><div class="grid4"><div class="card"><h2>Position Size Calculator</h2><div class="field"><label>Account balance ($)</label><input id="balance" type="number" value="10000"></div><div class="field" style="margin-top:10px"><label>Risk (%)</label><input id="riskpct" type="number" value="1"></div><div class="field" style="margin-top:10px"><label>Stop distance (points)</label><input id="stopdist" type="number" value="100"></div><button class="primary" style="margin-top:12px" onclick="calcLot()">Calculate</button><div id="lotresult" class="value"></div></div><div class="card"><h2>Risk / Reward</h2><div class="field"><label>Risk amount ($)</label><input id="riskamt" type="number" value="100"></div><div class="field" style="margin-top:10px"><label>Reward ratio</label><select id="rrcalc"><option>1:2</option><option>1:2.5</option><option>1:3</option></select></div><button class="primary" style="margin-top:12px" onclick="calcRR()">Calculate</button><div id="rrresult" class="value"></div></div><div class="card"><h2>Forex Market Hours</h2><p class="muted">Indicative UTC session schedule</p><p>Asian · 00:00–08:00</p><p>London · 08:00–13:00</p><p>New York · 13:00–22:00</p><div class="notice">Session times shift with daylight saving.</div></div><div class="card"><h2>Trader POV</h2><p class="muted">Shareable read-only profile preview.</p><button class="secondary" onclick="alert('Public profile publishing will be enabled after deployment.')">Preview profile →</button></div></div>`}function calcLot(){let risk=+$('#balance').value*(+$('#riskpct').value)/100,dist=+$('#stopdist').value;$('#lotresult').textContent=dist>0?(risk/dist).toFixed(3)+' units':'Enter stop distance'}function calcRR(){let r=+$('#riskamt').value,ratio=+$('#rrcalc').value.split(':')[1];$('#rrresult').textContent='$'+(r*ratio).toFixed(2)+' target'}
function sanctuaryPage(){return `<div class="sectionhead"><h2>Sanctuary</h2><p class="muted">Focus, meditation and discipline timer</p></div><div class="card" style="max-width:650px;margin:auto;text-align:center;padding:45px"><div class="eyebrow">FOCUS SESSION</div><div id="timerdisplay" style="font-size:64px;font-weight:800;margin:24px">15:00</div><div class="row" style="justify-content:center"><button class="secondary" onclick="setTimer(5)">5 min</button><button class="secondary" onclick="setTimer(15)">15 min</button><button class="secondary" onclick="setTimer(25)">25 min</button><button class="secondary" onclick="setTimer(45)">45 min</button></div><div class="row" style="justify-content:center;margin-top:22px"><button class="primary" id="timerstart" onclick="startTimer()">Start</button><button class="secondary" onclick="pauseTimer()">Pause</button><button class="secondary" onclick="resetTimer()">Reset</button></div><p class="muted">Use this space to step away from charts and return with a clear plan.</p></div>`}let timerTotal=900,timerLeft=900,timerInt=null;function setTimer(m){timerTotal=m*60;timerLeft=timerTotal;timerDisplay()}function timerDisplay(){let el=$('#timerdisplay');if(el)el.textContent=String(Math.floor(timerLeft/60)).padStart(2,'0')+':'+String(timerLeft%60).padStart(2,'0')}function startTimer(){if(timerInt)return;timerInt=setInterval(()=>{timerLeft=Math.max(0,timerLeft-1);timerDisplay();if(!timerLeft){pauseTimer();alert('Focus session complete.')}} ,1000)}function pauseTimer(){clearInterval(timerInt);timerInt=null}function resetTimer(){pauseTimer();timerLeft=timerTotal;timerDisplay()}
function settingsPage(){return `<div class="card"><div class="sectionhead"><div><h2>Profile & Settings</h2><p class="muted">Personalize your workspace and manage your trading rules.</p></div></div><div class="tabs"><button class="active">Profile</button><button>MT5/MT4</button><button>Settings</button><button>Security</button></div><div class="section"><h2>Trading Rules</h2><div class="notice">Set personal risk limits to support discipline. Values are saved to your account.</div><div class="formgrid section">${[['Max Risk Per Trade (%)','risk'],['Max Trades Per Day','max_trades'],['Max Daily Loss (%)','daily_loss'],['Max Losing Trades (consecutive)','losing_streak']].map(([l,k])=>`<div class="field"><label>${l}</label><input id="rule_${k}" type="number" value="${rules[k]??''}"></div>`).join('')}<div class="field"><label>Risk / Reward Ratio</label><select id="rule_rr">${['1:1','1:1.5','1:2','1:2.5','1:3','1:4','1:5'].map(x=>`<option ${rules.rr===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Preferred Sessions</label><input id="rule_sessions" value="${esc(rules.sessions||'London,Asian')}"></div><div class="field full"><label>Favorite Pairs (up to 5)</label><input id="rule_pairs" value="${esc(rules.pairs||'XAUUSD,EURUSD,GBPUSD')}"></div></div><button class="primary" style="margin-top:16px" onclick="saveRules()">Save Trading Rules</button></div><div class="section"><h2>Data & Privacy</h2><button class="secondary" onclick="exportJSON()">Export all my data (JSON)</button></div></div>`}
function drawChart(){let c=$('#equity');if(!c)return;let dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);x.strokeStyle='#20272d';x.lineWidth=1;for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,h*i/5);x.lineTo(w,h*i/5);x.stroke()}let vals=[0,...trades.slice().reverse().map((t,i,a)=>a.slice(0,i+1).reduce((s,z)=>s+z.pnl,0))];if(vals.length<2)vals=[0,0];let min=Math.min(...vals,0),max=Math.max(...vals,1),pad=18;x.beginPath();vals.forEach((v,i)=>{let px=pad+i*(w-2*pad)/(vals.length-1),py=h-pad-(v-min)/(max-min||1)*(h-2*pad);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle='#087cff';x.lineWidth=2.5;x.stroke();x.lineTo(w-pad,h-pad);x.lineTo(pad,h-pad);x.closePath();let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#087cff55');g.addColorStop(1,'#087cff00');x.fillStyle=g;x.fill()}
function openTrade(id){let t=id?trades.find(x=>x.id===id):{};let shots=[];try{shots=JSON.parse(t.screenshots||'[]')}catch{};$('#modal').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${id?'Edit Trade':'＋ Add Trade'}</h2><form id="tradeform" onsubmit="saveTrade(event,${id||'null'})"><div class="tabs"><button type="button" id="sideLong" class="${(t.side||'Long')==='Long'?'active':''}" onclick="setSide('Long')">↗ Long</button><button type="button" id="sideShort" class="${t.side==='Short'?'active':''}" onclick="setSide('Short')">↘ Short</button><input type="hidden" id="tf_side" value="${t.side||'Long'}"></div><div class="formgrid section">${[['Symbol','symbol',t.symbol||'XAUUSD','text'],['Quantity','quantity',t.quantity||'','number'],['Entry Price','entry',t.entry||'','number'],['Exit Price','exit',t.exit||'','number'],['Entry Date','opened',t.opened||'','datetime-local'],['Exit Date','closed',t.closed||'','datetime-local'],['P&L ($)','pnl',t.pnl??'','number'],['Session','session',t.session||'London','text'],['Setup','setup',t.setup||'','text']].map(([l,k,v,type])=>`<div class="field"><label>${l}</label><input id="tf_${k}" type="${type}" value="${esc(v)}" ${k==='symbol'?'required':''}></div>`).join('')}<div class="field full"><label>Pre-trade analysis</label><textarea id="tf_pre_analysis">${esc(t.pre_analysis||'')}</textarea></div><div class="field full"><label>Post-trade review</label><textarea id="tf_post_review">${esc(t.post_review||'')}</textarea></div><div class="field"><label>Emotions</label><input id="tf_emotions" value="${esc(t.emotions||'')}"></div><div class="field"><label>Lessons learned</label><input id="tf_lessons" value="${esc(t.lessons||'')}"></div><div class="field full"><label>Tags</label><input id="tf_tags" value="${esc(t.tags||'')}"></div><div class="field full"><label>Execution Checklist</label>${['Checked higher timeframe','Risk within limits','Fits my trading plan','Key levels identified','Economic calendar checked'].map((x,i)=>`<label class="check"><input type="checkbox" class="tf_check" value="${x}" ${JSON.parse(t.checklist||'[]').includes(x)?'checked':''}> ${x}</label>`).join('')}</div><div class="field full"><label>Trade screenshots</label><input id="tf_images" type="file" accept="image/*" multiple><div class="row" id="shotpreview">${shots.map(s=>`<img class="screenshot" src="${s}">`).join('')}</div><small class="muted">Images are stored with this trade in your app database. Keep uploads reasonably sized.</small></div></div><button class="primary" style="margin-top:18px">Save Trade</button></form>`;window.currentShots=shots;$('#modalback').style.display='flex';$('#tf_images').onchange=async e=>{for(const f of e.target.files){if(f.size>2*1024*1024){alert('Each screenshot must be 2 MB or smaller.');continue}let data=await new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});window.currentShots.push(data)}$('#shotpreview').innerHTML=window.currentShots.map(s=>`<img class="screenshot" src="${s}">`).join('')}}function setSide(s){$('#tf_side').value=s;$('#sideLong').classList.toggle('active',s==='Long');$('#sideShort').classList.toggle('active',s==='Short')}function closeModal(){$('#modalback').style.display='none'}async function saveTrade(e,id){e.preventDefault();let obj={};['symbol','quantity','entry','exit','opened','closed','pnl','session','setup','pre_analysis','post_review','emotions','lessons','tags'].forEach(k=>obj[k]=$('#tf_'+k).value);obj.side=$('#tf_side').value;obj.screenshots=window.currentShots||[];obj.checklist=[...document.querySelectorAll('.tf_check:checked')].map(x=>x.value);try{await api('/trades'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(obj)});closeModal();await load();render()}catch(e){showError(e)}}async function deleteTrade(id){if(!confirm('Delete this trade?'))return;await api('/trades/'+id,{method:'DELETE'});await load();render()}async function clearTrades(){if(confirm('Delete every trade in your account? This cannot be undone.')){await api('/trades',{method:'DELETE'});await load();render()}}async function saveRules(){let obj={};['risk','max_trades','daily_loss','losing_streak'].forEach(k=>obj[k]=$('#rule_'+k).value);obj.rr=$('#rule_rr').value;obj.sessions=$('#rule_sessions').value;obj.pairs=$('#rule_pairs').value;if(obj.pairs.split(',').filter(x=>x.trim()).length>5)return alert('You can select up to 5 favorite pairs.');await api('/rules',{method:'PUT',body:JSON.stringify(obj)});await load();alert('Trading rules saved.');render()}
function exportCSV(){let cols=['symbol','side','quantity','entry','exit','pnl','opened','closed','session','setup','pre_analysis','post_review','emotions','lessons','tags'];let csv=[cols.join(','),...trades.map(t=>cols.map(k=>'"'+String(t[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');download(csv,'trades.csv','text/csv')}function importCSV(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{let rows=r.result.trim().split(/\r?\n/),head=rows.shift().split(',').map(x=>x.trim());for(let line of rows){let vals=line.match(/("(?:[^"]|"")*"|[^,]*)(,|$)/g).filter(Boolean).map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replaceAll('""','"'));let o={};head.forEach((h,i)=>o[h]=vals[i]);try{await api('/trades',{method:'POST',body:JSON.stringify(o)})}catch{}}await load();render()};r.readAsText(f)}function exportJSON(){download(JSON.stringify({trades,rules},null,2),'tradefxbook-backup.json','application/json')}function download(data,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function searchAll(q){if(!q)return;let found=trades.find(t=>t.symbol.toLowerCase().includes(q.toLowerCase()));if(found){selected=found.id;go('Trades')}}
boot();setInterval(()=>{let el=$('#clock');if(el)el.textContent='◷ '+new Date().toLocaleTimeString()},1000);
</script></body></html>
