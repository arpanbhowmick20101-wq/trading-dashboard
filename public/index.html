<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TradeFXBook — Trading Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050607;
      --panel: #0d0f11;
      --panel2: #151719;
      --line: #202428;
      --muted: #75808b;
      --text: #f4f7fb;
      --blue: #087cff;
      --blue2: #0068e8;
      --red: #ff4050;
      --green: #08c88a;
      --gold: #f4b63f
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px Inter, Arial, sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer;
      color: inherit
    }

    .app {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh
    }

    .sidebar {
      height: 100vh;
      position: sticky;
      top: 0;
      border-right: 1px solid var(--line);
      background: #050607;
      padding: 18px 14px;
      overflow: auto
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.7px;
      margin: 2px 5px 38px
    }

    .brand i {
      color: var(--blue);
      font-style: normal
    }

    .beta {
      font-size: 9px;
      background: #ff8c32;
      color: #111;
      padding: 4px 6px;
      border-radius: 4px;
      vertical-align: top;
      margin-left: 5px
    }

    .userbox {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px
    }

    .avatar {
      background: #cf321e;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 20px
    }

    .userbox small,
    .muted {
      color: var(--muted)
    }

    .navlabel {
      font-size: 10px;
      color: #59636e;
      letter-spacing: 1.3px;
      margin: 22px 8px 12px
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 12px 11px;
      margin: 3px 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #9ba5b0;
      text-align: left
    }

    .nav button:hover,
    .nav button.active {
      background: #071d34;
      color: white
    }

    .nav button.active {
      box-shadow: inset 3px 0 var(--blue)
    }

    .nav .ico {
      width: 18px;
      text-align: center;
      color: #84909c;
      font-size: 17px
    }

    .main {
      min-width: 0
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 26px;
      position: sticky;
      top: 0;
      background: #060708ed;
      backdrop-filter: blur(14px);
      z-index: 5
    }

    .pagetitle {
      min-width: 140px;
      font-size: 19px;
      font-weight: 700
    }

    .pagetitle small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 4px
    }

    .search {
      flex: 1;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 15px;
      color: #9ba5b0
    }

    .topright {
      margin-left: auto;
      display: flex;
      gap: 9px;
      align-items: center
    }

    .iconbtn,
    .primary,
    .secondary,
    .danger {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 13px
    }

    .primary {
      background: var(--blue);
      border-color: var(--blue);
      font-weight: 600
    }

    .primary:hover {
      background: var(--blue2)
    }

    .danger {
      color: var(--red);
      border-color: #61212a
    }

    .content {
      padding: 24px 28px 48px;
      max-width: 1700px;
      margin: auto
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      min-width: 0
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 13px
    }

    .metric .symbol {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #08213a;
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 20px
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 1px;
      color: #74808d;
      text-transform: uppercase
    }

    .value {
      font-size: 25px;
      font-weight: 800;
      margin-top: 5px;
      color: var(--blue)
    }

    .positive {
      color: var(--blue) !important
    }

    .negative {
      color: var(--red) !important
    }

    .muted {
      color: var(--muted)
    }

    .section {
      margin-top: 22px
    }

    .sectionhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px
    }

    .sectionhead h2 {
      font-size: 16px;
      margin: 0
    }

    .chartbox {
      height: 270px;
      position: relative
    }

    .chartbox canvas {
      width: 100%;
      height: 100%
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px
    }

    .tablewrap {
      overflow: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 12px
    }

    th {
      color: #74808d;
      font-size: 10px;
      letter-spacing: .8px;
      font-weight: 500
    }

    tr:hover td {
      background: #111518
    }

    .pill {
      font-size: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #09223b;
      color: #56a8ff
    }

    .pill.red {
      background: #35191d;
      color: #ff6974
    }

    .tabs {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .tabs button {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: #9ba5b0
    }

    .tabs button.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue)
    }

    .formgrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px
    }

    .field label {
      display: block;
      font-size: 10px;
      color: #89939e;
      text-transform: uppercase;
      letter-spacing: .7px;
      margin: 0 0 7px
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px;
      background: #171a1d;
      border: 1px solid #292e33;
      color: white;
      border-radius: 10px;
      outline: none
    }

    .field textarea {
      min-height: 95px;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue)
    }

    .full {
      grid-column: 1/-1
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #293039;
      border-radius: 12px
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .right {
      margin-left: auto
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px
    }

    .day {
      background: #111416;
      border: 1px solid var(--line);
      border-radius: 10px;
      min-height: 65px;
      padding: 9px;
      font-size: 11px;
      color: #8d98a3
    }

    .day.profit {
      border-color: #07538c;
      background: #0a1d2b
    }

    .day.loss {
      border-color: #7b252d;
      background: #261316
    }

    .bar {
      height: 8px;
      background: #24292e;
      border-radius: 9px;
      overflow: hidden
    }

    .bar span {
      display: block;
      height: 100%;
      background: var(--blue)
    }

    .modalback {
      position: fixed;
      inset: 0;
      background: #000b;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px
    }

    .modal {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #0d0f11;
      border: 1px solid #30363c;
      border-radius: 18px;
      padding: 24px
    }

    .close {
      float: right;
      background: none;
      border: 0;
      color: #aab2ba;
      font-size: 22px
    }

    .notice {
      padding: 12px 14px;
      background: #0b1c2b;
      border: 1px solid #123d61;
      color: #80bdff;
      border-radius: 10px;
      font-size: 12px
    }

    .hidden {
      display: none !important
    }

    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px
    }

    .authbox {
      width: min(430px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 30px;
      border-radius: 20px
    }

    .authbox h1 {
      margin-top: 0
    }

    .authbox .field {
      margin: 14px 0
    }

    .authbox button {
      width: 100%;
      margin-top: 10px
    }

    .screenshot {
      width: 100%;
      max-width: 150px;
      border-radius: 8px;
      border: 1px solid var(--line)
    }

    .sessionbar {
      display: flex;
      height: 35px;
      border-radius: 8px;
      overflow: hidden;
      margin: 18px 0
    }

    .sessionbar span {
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #06111a
    }

    .sessionbar span:nth-child(1) {
      background: #ffad42;
      flex: 8
    }

    .sessionbar span:nth-child(2) {
      background: #087cff;
      flex: 5
    }

    .sessionbar span:nth-child(3) {
      background: #10bfa8;
      flex: 9
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px;
      background: #0b1d18;
      border: 1px solid #126143;
      border-radius: 8px;
      margin: 5px 0
    }

    .check input {
      accent-color: var(--green)
    }

    @media(max-width:1050px) {
      .app {
        grid-template-columns: 210px 1fr
      }

      .grid4 {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:720px) {
      .app {
        display: block
      }

      .sidebar {
        height: auto;
        position: relative;
        padding: 10px;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      .brand {
        margin: 4px 8px 12px
      }

      .userbox,
      .navlabel {
        display: none
      }

      .nav {
        display: flex;
        overflow: auto;
        gap: 5px
      }

      .nav button {
        width: auto;
        white-space: nowrap;
        padding: 10px
      }

      .nav button .ico {
        display: none
      }

      .topbar {
        padding: 0 12px;
        height: 62px
      }

      .search {
        display: none
      }

      .content {
        padding: 16px 12px
      }

      .grid4 {
        grid-template-columns: 1fr 1fr
      }

      .split {
        grid-template-columns: 1fr
      }

      .value {
        font-size: 20px
      }

      .card {
        padding: 15px
      }

      .formgrid {
        grid-template-columns: 1fr
      }

      .full {
        grid-column: auto
      }

      .pagetitle {
        font-size: 16px
      }

      .topright .iconbtn:first-child {
        display: none
      }
    }

    /* Screenshot-aligned TradeFXBook shell refresh */
    :root {
      --bg: #030405;
      --panel: #0d0e10;
      --panel2: #17191c;
      --line: #202226;
      --muted: #717b87;
      --text: #f4f6f9;
      --blue: #087cff;
      --blue2: #006be8
    }

    .app {
      grid-template-columns: 230px minmax(0, 1fr);
      min-height: 100vh
    }

    .sidebar {
      width: 230px;
      padding: 18px 12px 16px;
      background: #050607;
      border-right: 1px solid #191c20;
      display: flex;
      flex-direction: column
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 17px;
      white-space: nowrap;
      letter-spacing: -.7px;
      margin: 3px 5px 36px
    }

    .brandmark {
      font-weight: 900;
      font-style: italic;
      color: #fff;
      letter-spacing: -1.8px;
      font-size: 20px;
      text-shadow: 2px 0 var(--blue)
    }

    .brandblue {
      color: #1687ff
    }

    .beta {
      font-size: 8px;
      padding: 3px 5px;
      margin-left: 2px
    }

    .userbox {
      min-height: 54px;
      padding: 8px;
      border-radius: 13px;
      margin-bottom: 20px;
      background: #101214;
      border-color: #202328
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      background: #d83420;
      box-shadow: 0 0 0 2px #24282d
    }

    .useridentity {
      min-width: 0;
      flex: 1
    }

    .useridentity b {
      font-size: 12px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .useridentity small {
      font-size: 10px
    }

    .userchev {
      color: #6f7a86
    }

    .navlabel {
      margin: 2px 8px 10px;
      font-size: 9px;
      letter-spacing: 1.4px;
      color: #59616b
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      min-height: 0
    }

    .nav button {
      font-size: 12px;
      padding: 11px 10px;
      min-height: 39px;
      gap: 12px;
      color: #929ba6;
      border-radius: 9px;
      margin: 0
    }

    .nav button .ico {
      font-size: 16px;
      width: 17px
    }

    .nav button.active {
      background: #071d33;
      color: #f4f8ff;
      box-shadow: inset 2px 0 #0785ff
    }

    .nav button.active .ico {
      color: #1694ff
    }

    .nav button:hover {
      background: #111a24;
      color: #fff
    }

    .navgroup {
      margin: 0
    }

    .navgrouphead {
      width: 100%
    }

    .navchev {
      margin-left: auto;
      color: #1687ff
    }

    .navchildren {
      display: none;
      padding: 2px 0 4px 7px
    }

    .navgroup.expanded .navchildren {
      display: block
    }

    .navchildren button {
      font-size: 11px;
      padding: 9px 9px 9px 14px;
      min-height: 34px
    }

    .sidebarbottom {
      margin-top: auto;
      padding: 15px 6px 0;
      display: grid;
      gap: 8px
    }

    .freepill {
      border: 1px solid #123a5d;
      background: #081a2b;
      color: #8fcaff;
      border-radius: 9px;
      padding: 9px;
      font-size: 10px
    }

    .freepill span {
      color: #0b91ff;
      margin-right: 5px
    }

    .sidebarbottom small {
      font-size: 9px;
      color: #535e69;
      padding-left: 3px
    }

    .main {
      min-width: 0;
      background: #030405
    }

    .topbar {
      height: 72px;
      padding: 0 22px;
      gap: 18px;
      background: #050607f2;
      border-bottom: 1px solid #1b1e22
    }

    .pagetitle {
      font-size: 18px;
      min-width: 112px
    }

    .pagetitle small {
      font-size: 10px;
      color: #68727d
    }

    .searchwrap {
      height: 42px;
      max-width: 490px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      background: #101214;
      border: 1px solid #202429;
      border-radius: 12px;
      color: #707b87
    }

    .searchwrap .search {
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      outline: 0;
      min-width: 0;
      font-size: 12px
    }

    .searchwrap kbd {
      font-size: 9px;
      color: #69737d;
      background: #1a1d21;
      border: 1px solid #252a30;
      border-radius: 5px;
      padding: 4px 6px
    }

    .topright {
      gap: 8px
    }

    .iconbtn,
    .profiletop {
      height: 40px;
      min-width: 40px;
      border-radius: 10px;
      background: #101214;
      border: 1px solid #24282d;
      color: #b4bec9
    }

    .themebtn {
      color: #a58aff;
      font-size: 18px
    }

    .addtop {
      height: 40px;
      width: 40px;
      padding: 0;
      font-size: 22px;
      box-shadow: 0 5px 18px #087cff35
    }

    .clockbtn {
      font-size: 11px;
      white-space: nowrap
    }

    .profiletop {
      padding: 4px 9px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .profiletop span {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #d93420;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700
    }

    .content {
      padding: 22px 26px 68px;
      max-width: none
    }

    .card {
      background: #0d0f11;
      border-color: #202327;
      border-radius: 17px;
      box-shadow: 0 5px 18px #0002
    }

    .grid4 {
      gap: 12px
    }

    .metric {
      min-height: 100px;
      padding: 16px
    }

    .metric .symbol {
      width: 38px;
      height: 38px;
      background: #071f35;
      border: 1px solid #0b3152
    }

    .value {
      font-size: 23px;
      letter-spacing: -.5px
    }

    .sectionhead h2 {
      font-size: 15px
    }

    .chartbox {
      height: 270px
    }

    .tablewrap th {
      font-size: 9px
    }

    .newsticker {
      position: fixed;
      z-index: 4;
      bottom: 0;
      left: 230px;
      right: 0;
      height: 32px;
      background: #080a0c;
      border-top: 1px solid #1e2227;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 0 18px;
      overflow: hidden;
      white-space: nowrap;
      color: #a6b0ba;
      font-size: 10px
    }

    .newsticker b {
      color: #e5eaf0;
      letter-spacing: .6px
    }

    .newsticker i {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #078bff;
      border-radius: 50%;
      margin-right: 5px
    }

    .newsticker span {
      color: #78838e
    }

    .newsticker span:nth-child(2) {
      color: #168cff;
      font-weight: 700
    }

    @media(max-width:1000px) {
      .app {
        grid-template-columns: 205px minmax(0, 1fr)
      }

      .sidebar {
        width: 205px
      }

      .newsticker {
        left: 205px
      }

      .content {
        padding: 18px 16px 60px
      }

      .topbar {
        padding: 0 14px;
        gap: 10px
      }

      .pagetitle {
        min-width: 95px
      }

      .searchwrap {
        max-width: none
      }
    }

    @media(max-width:720px) {
      .app {
        display: block
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 10px
      }

      .brand {
        margin: 3px 8px 10px
      }

      .userbox,
      .navlabel,
      .sidebarbottom {
        display: none
      }

      .nav {
        display: flex;
        flex-direction: row;
        overflow: auto
      }

      .nav button {
        white-space: nowrap;
        width: auto
      }

      .navgroup {
        display: flex;
        align-items: center
      }

      .navchildren {
        display: none !important
      }

      .topbar {
        height: 60px
      }

      .searchwrap {
        display: none
      }

      .content {
        padding: 14px 11px 55px
      }

      .newsticker {
        left: 0
      }

      .profiletop {
        display: none
      }
    }


    /* Dedicated TradingView workspace */
    #tradingview-fullscreen:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      background: #0b0e11
    }

    #tradingview-fullscreen:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important
    }

    @media(max-width:720px) {
      #tradingview-fullscreen {
        height: calc(100vh - 220px) !important;
        min-height: 440px !important
      }
    }

    /* Premium Market Watchlist */
    .market-watch-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

<body>
  <div id="root"></div>
  <div class="modalback" id="modalback">

  <script>
    const $ = s => document.querySelector(s); let trades = [], rules = {}, page = 'Dashboard', selected = null, range = '30 Days', filter = 'All Trades'; const money = n => (n < 0 ? '-$' : '+$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); async function api(url, opt = {}) { let r; try { r = await fetch('/api' + url, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opt }) } catch (e) { throw Error('Cannot reach the local server. Check that npm.cmd start is still running, then refresh.') } let d = {}; try { d = await r.json() } catch { throw Error('Server returned an unreadable response (HTTP ' + r.status + '). Check the VS Code Terminal for an error.') } if (!r.ok) throw Error(d.error || ('Request failed (HTTP ' + r.status + ')')); return d } function showError(e) { const el = document.querySelector('#autherror'); if (el) { el.textContent = e.message || String(e); el.style.display = 'block' } else alert(e.message || e) }
    async function boot() {
      try {
        let me = await api('/me'); const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
        document.body.classList.toggle('light-theme', savedTheme === 'light'); if (!me.signedIn) return authScreen(); try { await load(); render() } catch (e) { document.body.innerHTML = '<div class="auth"><div class="authbox"><h1>Dashboard could not load</h1><p class="muted">Your sign-in may be active, but the dashboard data request failed.</p><p style="color:#ff8585">' + esc(e.message) + '</p><button class="primary" onclick="location.reload()">Retry</button><p class="muted">Keep the VS Code Terminal running while using the app.</p></div></div>' }
      } catch (e) { authScreen(); showError(e) }
    } async function load() { trades = await api('/trades'); rules = await api('/rules') }
    function authScreen() { document.body.innerHTML = `<div class="auth"><div class="authbox"><div class="brand"><i>TFB</i> TradeFXBook <span class="beta">BETA</span></div><h1 id="authtitle">Welcome back</h1><p class="muted">Your private paper-trading journal and analytics workspace.</p><div class="field" id="namefield"><label>Name</label><input id="authname" placeholder="Your name"></div><div class="field"><label>Email</label><input id="authemail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authpass" type="password" placeholder="At least 8 characters"></div><button class="primary" id="authsubmit" onclick="submitAuth()">Create account</button><p id="autherror" style="display:none;color:#ff8585;margin-top:12px"></p><p class="muted" style="text-align:center;margin-top:18px"><span id="authswitch">Already have an account?</span> <a href="#" onclick="toggleAuth(event)" style="color:#1687ff">Sign in</a></p><div class="notice">Demo workspace: record and review simulated trades. No broker connection.</div></div></div>`; window.authMode = 'register' } function toggleAuth(e) { e.preventDefault(); window.authMode = window.authMode === 'register' ? 'login' : 'register'; $('#authtitle').textContent = window.authMode === 'register' ? 'Create your account' : 'Welcome back'; $('#namefield').classList.toggle('hidden', window.authMode === 'login'); $('#authsubmit').textContent = window.authMode === 'register' ? 'Create account' : 'Sign in'; $('#authswitch').textContent = window.authMode === 'register' ? 'Already have an account?' : 'New here?' } async function submitAuth() { const b = $('#authsubmit'); const original = b.textContent; b.disabled = true; b.textContent = 'Please wait…'; const err = $('#autherror'); if (err) { err.style.display = 'none'; err.textContent = '' } try { await api('/' + window.authMode, { method: 'POST', body: JSON.stringify({ name: $('#authname')?.value, email: $('#authemail').value.trim(), password: $('#authpass').value }) }); b.textContent = 'Signed in — opening dashboard…'; location.href = '/' } catch (e) { showError(e); b.disabled = false; b.textContent = original } }
    const nav = [['Dashboard', '▦'], ['Trades', '▱'], ['Journal', '▤'], ['Trading', '⌁'], ['Market', '↗'], ['AI Report', '✧'], ['Backtesting', '⌘'], ['Traders Lounge', '♧'], ['Tools', '⚒'], ['Sanctuary', '◷'], ['Settings', '⚙']];
    function shell() { return `<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">TFB</span><span>Trade<span class="brandblue">FX</span>Book</span><span class="beta">BETA</span></div><div class="userbox"><div class="avatar">A</div><div class="useridentity"><b>My Trading Desk</b><br><small>Profile · All features free</small></div><span class="userchev">›</span></div><div class="navlabel">MENU</div><nav class="nav">${nav.slice(0, 3).map(([n, i]) => `<button class="${page === n ? 'active' : ''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</button>`).join('')}<div class="navgroup ${['Performance', 'Trade Analysis'].includes(page) ? 'expanded' : ''}"><button class="navgrouphead ${['Performance', 'Trade Analysis'].includes(page) ? 'active' : ''}" onclick="this.parentElement.classList.toggle('expanded')"><span class="ico">▥</span>Analysis <span class="navchev">⌄</span></button><div class="navchildren"><button class="${page === 'Performance' ? 'active' : ''}" onclick="go('Performance')"><span class="ico">⌁</span>Performance</button><button class="${page === 'Trade Analysis' ? 'active' : ''}" onclick="go('Trade Analysis')"><span class="ico">▤</span>Trade Analysis</button></div></div>${nav.slice(3).map(([n, i]) => `<button class="${page === n ? 'active' : ''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</button>`).join('')}<button onclick="alert('Help & Support: use the in-app journal and settings for this local demo.')"><span class="ico">ⓘ</span>Help & Support</button></nav><div class="sidebarbottom"><div class="freepill"><span>●</span> All features unlocked</div><small>TradeFXBook · Local workspace</small></div></aside><main class="main"><header class="topbar"><div class="pagetitle">${page}<small>${new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</small></div><div class="searchwrap"><span>⌕</span><input class="search" placeholder="Search..." oninput="searchAll(this.value)"><kbd>Ctrl K</kbd></div><div class="topright"><button class="iconbtn themebtn" title="Toggle theme" onclick="document.body.classList.toggle('dim')">☾</button><button class="primary addtop" title="Add paper-trade journal entry" onclick="openTrade()">＋</button><button class="iconbtn clockbtn" id="clock">◷ --:--</button><button class="iconbtn" title="Notifications" onclick="alert('You are all caught up.')">♧</button><button class="profiletop" onclick="logout()"><span>A</span>⌄</button></div></header><div class="content" id="view">${pageContent()}</div><div class="newsticker"><b><i></i> NEWS</b><span>DEMO WORKSPACE</span><span>Market information is illustrative in this local build</span><span>Paper-trading journal · No broker connection</span></div></main></div>` }
    function render() {
      const root = document.querySelector('#root');

      if (!root) {
        console.error('Dashboard root element not found.');
        return;

      root.innerHTML = shell();

      drawChart();

      if (page === 'Market') {
        marketClock();
        updateTradingSession();

        if (window.tradingSessionInterval) {
          clearInterval(window.tradingSessionInterval);
        }

        window.tradingSessionInterval = setInterval(() => {
          if (page === 'Market') {
            updateTradingSession();
          }
        }, 60000);
      }

      if (page === 'Trading') loadTradingViewChart();
      if (page === 'Sanctuary') timerDisplay();
      if (page === 'Backtesting') renderBTNotes();
    }
    if (window.marketClockInterval) {
      clearInterval(window.marketClockInterval);
    }

    window.marketClockInterval = setInterval(() => {
      if (page === 'Market') marketClock();
    }, 1000);
    function go(p) { page = p; selected = null; render() } function logout() { api('/logout', { method: 'POST' }).then(() => location.reload()) } function stats() { let total = trades.reduce((a, t) => a + (+t.pnl || 0), 0), wins = trades.filter(t => t.pnl > 0).length, loss = trades.filter(t => t.pnl < 0).length, gp = trades.filter(t => t.pnl > 0).reduce((a, t) => a + t.pnl, 0), gl = Math.abs(trades.filter(t => t.pnl < 0).reduce((a, t) => a + t.pnl, 0)); return { total, wins, loss, rate: trades.length ? wins / trades.length * 100 : 0, gp, gl, pf: gl ? gp / gl : 0, avg: trades.length ? total / trades.length : 0 } }
    function pageContent() { switch (page) { case 'Dashboard': return dashboard(); case 'Trades': return tradesPage(); case 'Journal': return journalPage(); case 'Trading': return tradingPage(); case 'Performance': return performancePage(); case 'Trade Analysis': return tradeAnalysis(); case 'Market': return marketPage(); case 'AI Report': return aiPage(); case 'Backtesting': return backtestPage(); case 'Traders Lounge': return loungePage(); case 'Tools': return toolsPage(); case 'Sanctuary': return sanctuaryPage(); case 'Settings': return settingsPage(); default: return dashboard() } }
    function calendarHTML() {
      const now = new Date(), year = now.getFullYear(), month = now.getMonth();
      const first = new Date(year, month, 1), days = new Date(year, month + 1, 0).getDate(), offset = first.getDay();
      const daily = {};
      trades.forEach(t => {
        const raw = t.closed || t.opened || '';
        if (!raw) return;
        const d = new Date(raw);
        if (Number.isNaN(d.getTime()) || d.getFullYear() !== year || d.getMonth() !== month) return;
        const day = d.getDate(); daily[day] = (daily[day] || 0) + (Number(t.pnl) || 0);
      });
      const cells = [];
      for (let i = 0; i < offset; i++)cells.push('<div class="muted" style="min-height:68px;padding:8px"></div>');
      for (let day = 1; day <= days; day++) {
        const pnl = daily[day], has = Object.prototype.hasOwnProperty.call(daily, day);
        cells.push(`<div style="min-height:68px;padding:8px;border:1px solid var(--line);border-radius:8px;background:${has ? (pnl >= 0 ? 'rgba(22,163,74,.09)' : 'rgba(220,38,38,.09)') : 'transparent'}"><div style="font-size:12px;color:var(--muted)">${day}</div>${has ? `<b class="${pnl >= 0 ? 'positive' : 'negative'}" style="font-size:12px">${money(pnl)}</b>` : '<span class="muted">—</span>'}</div>`);
      }
      return `<div class="sectionhead"><h3>${now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3><small class="muted">Recorded trade P&amp;L by day</small></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="eyebrow" style="text-align:center">${d}</div>`).join('')}${cells.join('')}</div>`;
    }


    function dashboard() {
      let s = stats();

      const validTrades = trades.map(t => ({
        ...t,
        pnl: Number(t.pnl) || 0,
        date: new Date(t.closed || t.opened)
      })).filter(t => !isNaN(t.date.getTime()));

      const now = new Date();

      const sameDay = (d) => {
        return d.getFullYear() === now.getFullYear() &&
          d.getMonth() === now.getMonth() &&
          d.getDate() === now.getDate();
      };

      const startWeek = new Date(now);
      startWeek.setHours(0, 0, 0, 0);
      startWeek.setDate(now.getDate() - ((now.getDay() + 6) % 7));

      const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);

      const sum = (items) => items.reduce((a, t) => a + t.pnl, 0);

      const today = validTrades.filter(t => sameDay(t.date));
      const weekly = validTrades.filter(t => t.date >= startWeek);
      const monthly = validTrades.filter(t => t.date >= startMonth);

      const todayPnl = sum(today);
      const weekPnl = sum(weekly);
      const monthPnl = sum(monthly);

      const bySymbol = Object.values(trades.reduce((a, t) => {
        let k = (t.symbol || 'Other').toUpperCase();

        (a[k] ??= { symbol: k, pnl: 0, count: 0, wins: 0 }).pnl += Number(t.pnl) || 0;
        a[k].count++;

        if ((Number(t.pnl) || 0) > 0) a[k].wins++;

        return a;
      }, {})).sort((a, b) => b.pnl - a.pnl).slice(0, 5);

      let best = trades.length
        ? trades.reduce((a, b) => (Number(a.pnl) || 0) > (Number(b.pnl) || 0) ? a : b)
        : null;

      let worst = trades.length
        ? trades.reduce((a, b) => (Number(a.pnl) || 0) < (Number(b.pnl) || 0) ? a : b)
        : null;

      const metricCard = (label, value, sub) => {
        return `
      <div class="card">
        <div class="eyebrow">${label}</div>
        <div class="value ${value >= 0 ? 'positive' : 'negative'}">${money(value)}</div>
        <small class="muted">${sub}</small>
      </div>
    `;
      };

      return `
    <div class="sectionhead">
      <div>
        <h2>Trading Overview</h2>
        <small class="muted">Your personal trading journal dashboard</small>
      </div>
      <button class="primary" onclick="openTrade()">＋ Add Trade</button>
    </div>

    <div class="grid4">
      <div class="card metric">
        <div class="eyebrow">TOTAL P&L</div>
        <div class="value ${s.total >= 0 ? 'positive' : 'negative'}">${money(s.total)}</div>
        <small class="muted">${trades.length} recorded trades</small>
      </div>

      <div class="card metric">
        <div class="eyebrow">WIN RATE</div>
        <div class="value">${s.rate.toFixed(1)}%</div>
        <div class="bar"><span style="width:${s.rate}%"></span></div>
        <small class="muted">${s.wins} wins · ${s.loss} losses</small>
      </div>

      <div class="card metric">
        <div class="eyebrow">PROFIT FACTOR</div>
        <div class="value">${s.pf.toFixed(2)}</div>
        <small class="muted">Gross profit / gross loss</small>
      </div>

      <div class="card metric">
        <div class="eyebrow">EXPECTANCY</div>
        <div class="value ${s.avg >= 0 ? 'positive' : 'negative'}">${money(s.avg)}</div>
        <small class="muted">Average per trade</small>
      </div>
    </div>

    <div class="section">
      <div class="sectionhead">
        <h2>Performance Overview</h2>
        <small class="muted">Based on recorded trade dates</small>
      </div>

      <div class="grid4">
        ${metricCard("TODAY'S P&L", todayPnl, `${today.length} trades today`)}
        ${metricCard("THIS WEEK", weekPnl, `${weekly.length} trades this week`)}
        ${metricCard("THIS MONTH", monthPnl, `${monthly.length} trades this month`)}
        ${metricCard("REALIZED P&L", s.total, "All saved journal trades")}
      </div>
    </div>

    <div class="card section">
      <div class="sectionhead">
        <div>
          <div class="eyebrow">EQUITY PERFORMANCE</div>
          <h2 class="${s.total >= 0 ? 'positive' : 'negative'}">${money(s.total)}</h2>
        </div>
        <span class="pill">Recorded P&L</span>
      </div>

    </div>

    <div class="split section">

        </div>

        ${trades.slice(0, 5).map(t => `
          <div class="row" style="padding:13px 0;border-bottom:1px solid var(--line)">
            <b>${esc(t.symbol)}</b>

      </div>

      <div class="card">

    function tradesPage() { return `<div class="sectionhead"><div><h2>Trades</h2><small class="muted">${trades.length} recorded trades · Private workspace</small></div><div class="row"><button class="danger" onclick="clearTrades()">♧ Clear All</button><button class="primary" onclick="openTrade()">＋ Add Trade</button></div></div><div class="card"><div class="sectionhead"><h2>Trade History</h2><div class="row"><button class="secondary" onclick="exportCSV()">⇩ Export CSV</button><button class="secondary" onclick="$('#csvfile').click()">Import CSV</button><input id="csvfile" type="file" accept=".csv" hidden onchange="importCSV(this)"></div></div><div class="tablewrap"><table><thead><tr><th>OPEN / CLOSE</th><th>SYMBOL</th><th>TYPE</th><th>ENTRY</th><th>EXIT</th><th>SIZE</th><th>P&L</th><th>SESSION</th><th>ACTIONS</th></tr></thead><tbody>${trades.map(t => `<tr><td>${esc(t.opened || '—')}<br><span class="muted">${esc(t.closed || '')}</span></td><td><b>${esc(t.symbol)}</b></td><td><span class="pill ${t.side === 'Short' ? 'red' : ''}">${esc(t.side)}</span></td><td>${t.entry}</td><td>${t.exit}</td><td>${t.quantity}</td><td class="${t.pnl >= 0 ? 'positive' : 'negative'}"><b>${money(t.pnl)}</b></td><td>${esc(t.session)}</td><td><button class="secondary" onclick="openTrade(${t.id})">Edit</button> <button class="danger" onclick="deleteTrade(${t.id})">×</button></td></tr>`).join('') || `<tr><td colspan="9"><div class="empty">No trades yet. Click Add Trade to get started.</div></td></tr>`}</tbody></table></div></div>` }

    function journalInsights() {
      const groups = (field) => {
        const result = {};

        trades.forEach(t => {
          const name = String(t[field] || 'Not specified').trim();
          if (!result[name]) result[name] = { count: 0, wins: 0, losses: 0, pnl: 0 };

          result[name].count++;
          result[name].pnl += Number(t.pnl) || 0;

          if ((Number(t.pnl) || 0) > 0) result[name].wins++;
          if ((Number(t.pnl) || 0) < 0) result[name].losses++;
        });

        return Object.entries(result)
          .sort((a, b) => b[1].pnl - a[1].pnl);
      };

      const renderGroups = (items) => {
        if (!items.length) return '<p class="muted">No journal data yet.</p>';

        return items.slice(0, 6).map(([name, v]) => {
          const rate = v.count ? v.wins / v.count * 100 : 0;

          return `
        <div style="padding:13px 0;border-bottom:1px solid var(--line)">
          <div class="row">
            <b>${esc(name)}</b>
            <b class="right ${v.pnl >= 0 ? 'positive' : 'negative'}">${money(v.pnl)}</b>

    function sortMarketSymbolsAZ() {
      const tbody = document.getElementById('market-symbol-list');
      if (!tbody) return;

      const rows = [...tbody.querySelectorAll('.market-symbol-row')];

      marketSortDirection =
        marketSortDirection === 'asc' ? 'desc' : 'asc';

      rows.sort((a, b) => {
        const symbolA = a.dataset.symbol || '';
        const symbolB = b.dataset.symbol || '';

        const favA = favouriteMarketSymbols.includes(symbolA);
        const favB = favouriteMarketSymbols.includes(symbolB);

        if (favA !== favB) return Number(favB) - Number(favA);

        return marketSortDirection === 'asc'
          ? symbolA.localeCompare(symbolB)
          : symbolB.localeCompare(symbolA);
      });

      rows.forEach(row => tbody.appendChild(row));

      const sortButton = document.getElementById('market-sort-button');

      if (sortButton) {
        sortButton.textContent =
          marketSortDirection === 'asc' ? '↓ Sort A–Z' : '↑ Sort Z–A';

    function importMarketWatchlist(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        const lines = e.target.result.split(/\r?\n/);
        let added = 0;

        lines.slice(1).forEach(line => {
          const columns = line.match(/("([^"]|"")*"|[^,]*)(,|$)/g);
          if (!columns) return;

          const symbol = columns[0]
            .replace(/,$/, '')
            .replace(/^"|"$/g, '')
            .replace(/""/g, '"')
            .trim()
            .toUpperCase();

          if (!/^[A-Z0-9._-]{2,15}$/.test(symbol)) return;

          const exists = [
            'XAUUSD', 'EURUSD', 'GBPUSD',
            'USDJPY', 'BTCUSD', 'US30',
            ...customMarketSymbols
          ].includes(symbol);

          if (!exists) {
            customMarketSymbols.push(symbol);
            added++;
          }
        });

        localStorage.setItem(
          'customMarketSymbols',
          JSON.stringify(customMarketSymbols)
        );

        alert(`${added} new symbol(s) imported successfully.`);
        render();
      };

      reader.readAsText(file);
      event.target.value = '';
    }

      const confirmRemove = confirm(
        `Are you sure you want to remove ${symbol} from your watchlist?`

      if (!confirmRemove) return;

      customMarketSymbols = customMarketSymbols.filter(
        item => item !== symbol

      favouriteMarketSymbols = favouriteMarketSymbols.filter(
        item => item !== symbol
      );

      delete marketSymbolNotes[symbol];

      localStorage.setItem(

    function editMarketSymbol(oldSymbol) {
      const newSymbol = prompt(
        `Edit symbol ${oldSymbol}:`,
        oldSymbol
      );

      if (newSymbol === null) return;

      const updatedSymbol = newSymbol.trim().toUpperCase();

      if (!/^[A-Z0-9._-]{2,15}$/.test(updatedSymbol)) {
        alert('Enter a valid symbol.');
        return;
      }

      if (updatedSymbol === oldSymbol) return;

      const exists = [
        'XAUUSD',
        'EURUSD',
        'GBPUSD',
        'USDJPY',
        'BTCUSD',
        'US30',
        ...customMarketSymbols.filter(s => s !== oldSymbol)
      ].includes(updatedSymbol);

      if (exists) {
        alert('This symbol already exists.');
        return;
      }

      customMarketSymbols = customMarketSymbols.map(symbol =>
        symbol === oldSymbol ? updatedSymbol : symbol
      );

      if (favouriteMarketSymbols.includes(oldSymbol)) {
        favouriteMarketSymbols = favouriteMarketSymbols.map(symbol =>
          symbol === oldSymbol ? updatedSymbol : symbol
        );
      }

      if (marketSymbolNotes[oldSymbol] !== undefined) {
        marketSymbolNotes[updatedSymbol] = marketSymbolNotes[oldSymbol];
        delete marketSymbolNotes[oldSymbol];
      }

      localStorage.setItem('customMarketSymbols', JSON.stringify(customMarketSymbols));
      localStorage.setItem('favouriteMarketSymbols', JSON.stringify(favouriteMarketSymbols));
      localStorage.setItem('marketSymbolNotes', JSON.stringify(marketSymbolNotes));

      render();
    }

function calcLot() {
  const balance = Number($('#balance').value);
  const riskPct = Number($('#riskpct').value);
  const stopDist = Number($('#stopdist').value);
  const asset = $('#asset').value;
  const result = $('#lotresult');

  // Illustrative default assumptions
  const pointValues = {
    XAUUSD: 10,
    EURUSD: 10,
    GBPUSD: 10,
    USDJPY: 10,
    BTCUSD: 1,
    US30: 1,
    NAS100: 1,
    CUSTOM: 1
  };

  const pointValue = pointValues[asset];

  if (
    !Number.isFinite(balance) || balance <= 0 ||
    !Number.isFinite(riskPct) || riskPct <= 0 || riskPct > 100 ||
    !Number.isFinite(stopDist) || stopDist <= 0
  ) {
    result.textContent = 'Please enter valid values.';
    return;
  }

  const riskAmount = balance * riskPct / 100;
  const lotSize = riskAmount / (stopDist * pointValue);

  $('#pointvalue').value = '$' + pointValue.toFixed(2);

  result.innerHTML = `
    <div style="margin-top:12px">
      <div class="muted">Asset: ${asset}</div>
      <div>Risk Amount: $${riskAmount.toFixed(2)}</div>
      <div>Point Value: $${pointValue.toFixed(2)}</div>
      <div style="font-size:22px;font-weight:700;margin-top:8px">

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContext();

          const gain = audio.createGain();

          oscillator.connect(gain);
          gain.connect(audio.destination);

          oscillator.frequency.value = 660;
          gain.gain.setValueAtTime(0.15, audio.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(
            0.001, audio.currentTime + delay + 0.3
          );

          oscillator.start(audio.currentTime + delay);

    function drawChart() {
      let c = $('#equity');
      if (!c) return;

      let dpr = window.devicePixelRatio || 1;
      let w = c.clientWidth;
      let h = c.clientHeight;

      if (!w || !h) return;

      c.width = w * dpr;
      c.height = h * dpr;

      let x = c.getContext('2d');
      x.scale(dpr, dpr);

      x.clearRect(0, 0, w, h);

      const pad = 25;

      // Background grid
      x.strokeStyle = 'rgba(130,150,170,0.13)';
      x.lineWidth = 1;

      for (let i = 1; i < 5; i++) {
        x.beginPath();
        x.moveTo(pad, h * i / 5);
        x.lineTo(w - pad, h * i / 5);
        x.stroke();
      }

      // Cumulative equity values
      let vals = [
        0,
        ...trades.slice().reverse().map((t, i, a) =>
          a.slice(0, i + 1).reduce((s, z) => s + (Number(z.pnl) || 0), 0)
        )
      ];

      if (vals.length < 2) vals = [0, 0];

      const min = Math.min(...vals, 0);
      const max = Math.max(...vals, 1);
      const range = max - min || 1;

      const points = vals.map((v, i) => ({
        x: pad + i * (w - 2 * pad) / (vals.length - 1),
        y: h - pad - (v - min) / range * (h - 2 * pad)
      }));

      // Smooth Bezier curve
      function drawSmoothPath() {
        x.beginPath();
        x.moveTo(points[0].x, points[0].y);

        for (let i = 0; i < points.length - 1; i++) {
          const current = points[i];
          const next = points[i + 1];

          const midX = (current.x + next.x) / 2;
          const midY = (current.y + next.y) / 2;

          if (i === 0) {
            x.lineTo(midX, midY);
          } else {
            x.quadraticCurveTo(
              current.x, current.y,
              midX, midY
            );
          }
        }

        const last = points[points.length - 1];

        x.quadraticCurveTo(
          points[points.length - 2].x,
          points[points.length - 2].y,
          last.x,
          last.y
        );
      }

      // Gradient area
      drawSmoothPath();
      x.lineTo(points[points.length - 1].x, h - pad);
      x.lineTo(points[0].x, h - pad);
      x.closePath();

      const gradient = x.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, 'rgba(8,124,255,0.30)');
      gradient.addColorStop(1, 'rgba(8,124,255,0.00)');

      x.fillStyle = gradient;
      x.fill();

      // Glowing smooth line
      drawSmoothPath();

      x.strokeStyle = '#087cff';
      x.lineWidth = 3;
      x.lineJoin = 'round';
      x.lineCap = 'round';

      x.shadowColor = 'rgba(8,124,255,0.45)';
      x.shadowBlur = 12;

      x.stroke();

      x.shadowBlur = 0;

      // Last point
      const last = points[points.length - 1];

      x.beginPath();
      x.arc(last.x, last.y, 4, 0, Math.PI * 2);
      x.fillStyle = '#087cff';
      x.fill();
    }

    function contractSize(symbol) {
      const s = (symbol || '').toUpperCase().replace('/', '');

      if (/^(US30|NAS100|US100|SPX500|US500|USTEC|DJ30)/.test(s)) return 1;

      return 100000;
    }

      const entry = Number($('#tf_entry')?.value) || 0;
      const exit = Number($('#tf_exit')?.value) || 0;

      const hiddenPnl = $('#tf_pnl');

    }

    <img id="largeScreenshot" src="${src}"
      style="max-width:90vw;max-height:85vh;object-fit:contain;
      cursor:zoom-in;transition:transform .25s ease;transform:scale(1)">
  `;

    document.body.appendChild(overlay);

    const image = document.getElementById('largeScreenshot');

    image.onclick = () => {
      const zoomed = image.dataset.zoomed === 'true';
      image.style.transform = zoomed ? 'scale(1)' : 'scale(1.8)';
      image.style.cursor = zoomed ? 'zoom-in' : 'zoom-out';
      image.dataset.zoomed = zoomed ? 'false' : 'true';
    };

    document.getElementById('closeScreenshot').onclick = () => overlay.remove();

    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) overlay.remove();
    });

    document.addEventListener('keydown', function closeOnEscape(event) {
      if (event.key === 'Escape') {
        overlay.remove();
        document.removeEventListener('keydown', closeOnEscape);
      }
    });
  }
</script>
